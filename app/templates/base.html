<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>{% block title %}QueueLess{% endblock %}</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                QueueLess
            </div>

            <div class="nav-links">
                <a href="{{ url_for('main.home') }}">Home</a>
            </div>
        </nav>
    </header>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer>
        <p>© 2026 QueueLess</p>
    </footer>

</body>
</html>
